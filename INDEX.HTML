<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<!-- Gauche : formulaire -->
<div class="left">
<h1>Ready to start your success story?</h1>
<p>Signup to our website and start leafing through your favorite literature today!</p>

<form>
<label>Full name</label>
<input type="text" placeholder="Jane Doe">

<label>Email</label>
<input type="email" placeholder="janedoe@mail.com">

<label>Area of interest</label>
<select>
<option>Fiction</option>
<option>Non-Fiction</option>
<option>Science</option>
<option>History</option>
</select>

<div class="checkbox">
<input type="checkbox" id="terms" style="width:auto;">
<label for="terms" style="display:inline; font-weight:normal;">
I agree to the <a href="#">Terms &amp; Conditions</a>
</label>
</div>

<button type="submit">Sign up</button>
</form>
</div>

<!-- Droite : image -->
<div class="right">
<img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500"
alt="Femme avec un livre">
</div>

</div>

</body>
</html>
